<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>View Orders • StyledUp</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #f3e7f7, #f9f9f9);
    margin: 0;
    padding: 0;
}

/* Header */
.header {
    background: #2b2b2b;
    color: white;
    padding: 16px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header h1 {
    font-family: "Playfair Display", serif;
    font-weight: 500;
    font-size: 1.8rem;
}

.header .user-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.header .user-info a {
    color: white;
    text-decoration: none;
}

.header .user-info a:hover {
    text-decoration: underline;
}

/* Container */
.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

/* Dashboard cards */
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    text-align: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 40px rgba(0,0,0,0.12);
}

.card h3 {
    margin-bottom: 12px;
    color: #333;
    font-weight: 500;
}

.card p {
    font-size: 1.3rem;
    font-weight: bold;
    color: #007bff;
}

/* Orders table */
.orders-section h2 {
    margin-bottom: 20px;
    font-family: "Playfair Display", serif;
    font-size: 1.6rem;
    color: #333;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0,0,0,0.05);
}

thead {
    background: #f0f0f0;
}

th, td {
    padding: 15px;
    text-align: left;
}

th {
    font-weight: 600;
    font-size: 0.95rem;
}

td {
    font-size: 0.9rem;
    color: #555;
}

.status {
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
}

.status.pending {
    background-color: #fff3cd;
    color: #856404;
}

.status.delivered {
    background-color: #d4edda;
    color: #155724;
}
</style>
</head>

<body>
    <div class="header">
        <h1>StyledUp</h1>
        <div class="user-info">
            <span th:text="'Hello, ' + ${currentUser.username}"></span>
            <a th:href="@{/view-cart}">Cart (<span th:text="${cartItemCount ?: 0}"></span>)</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="container">
        <!-- Dashboard cards -->
        <div class="dashboard-grid">
            <div class="card">
                <h3>Total Orders</h3>
                <p th:text="${orders.size()}">0</p>
            </div>
            <!--<div class="card">
                <h3>Pending Orders</h3>
                <p th:text="${orders.stream().filter(o -> o.status == 'PENDING').count()}">0</p>
            </div>
            <div class="card">
                <h3>Total Spent</h3>
                <p th:text="${#numbers.formatDecimal(orders.stream().mapToDouble(o -> o.totalAmount).sum(), 1, 'COMMA', 2, 'POINT')}">$0.00</p>
            </div>-->
        </div>

        <!-- Orders table -->
        <div class="orders-section">
            <h2>Recent Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="'#ORD' + ${order.id}"></td>
                        <!--<td th:text="${#dates.format(order.orderDate, 'MMM dd, yyyy')}"></td>-->
                        <td>
                            <span th:each="item : ${order.items}" th:text="${item.product.name} + ', '"></span>
                        </td>
                        <!--<td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <span class="status" th:classappend="${order.status.toLowerCase()}" th:text="${order.status}"></span>
                        </td>-->
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
