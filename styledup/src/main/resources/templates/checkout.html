<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout • StyledUp</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://js.stripe.com/v3/"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #f7f4fa, #ffffff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #333;
}

/* MAIN CONTAINER */
.checkout-container {
    max-width: 520px;
    width: 100%;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
}

/* HEADER */
.checkout-header {
    text-align: center;
    margin-bottom: 30px;
}

.checkout-header h2 {
    font-family: "Playfair Display", serif;
    font-size: 28px;
}

.checkout-header p {
    font-size: 0.85rem;
    color: #666;
    margin-top: 6px;
}

/* SUMMARY */
.order-summary {
    background: #f8f8fb;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 25px;
    font-size: 0.9rem;
}

.order-summary strong {
    color: #000;
}

/* FORM */
.form-row {
    margin-bottom: 20px;
}

label {
    font-size: 0.85rem;
    font-weight: 500;
    display: block;
    margin-bottom: 8px;
}

#card-element {
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: white;
}

/* SECURITY NOTE */
.security-note {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.75rem;
    color: #666;
    margin-top: 10px;
}

/* ERRORS */
#card-errors {
    color: #c0392b;
    font-size: 0.8rem;
    margin-top: 10px;
}

/* BUTTON */
button {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    border-radius: 30px;
    border: none;
    background: #b470c9;
    color: white;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.15s ease;
}

button:hover {
    background: #9d5bb2;
}

button:active {
    transform: scale(0.97);
}

/* FOOTER TRUST */
.trust-footer {
    text-align: center;
    font-size: 0.75rem;
    color: #777;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="checkout-container">
    <div class="checkout-header">
        <h2>Secure Checkout</h2>
        <p>Your payment is protected and encrypted</p>
    </div>

    <div class="order-summary">
        Subtotal (<strong><span th:text="${totalItems}">0</span></strong> items):  
        <strong>$<span th:text="${totalPrice}">0.00</span></strong>
    </div>

    <form id="payment-form">
        <div class="form-row">
            <label for="card-element">Credit or Debit Card</label>
            <div id="card-element"></div>
            <div id="card-errors" role="alert"></div>

            <div class="security-note">
                🔒 Payments are securely processed by Stripe
            </div>
        </div>

        <button id="submit">
            Pay $<span th:text="${totalPrice}">0.00</span>
        </button>
    </form>

    <div class="trust-footer">
        We never store your card details • PCI-DSS compliant
    </div>
</div>

<script>
  const stripe = Stripe("pk_test_51SkWZvLYfekvNbFBR9dIoM1uA4X2WIi1WKWBsYQCyR1FmkmtiOaHbvrfo31Jm9HHkJXiLLDgvus4DtybviQ7GQtj00esxWbQCT");
  console.log("Stripe initialized");

  const elements = stripe.elements();
  const cardElement = elements.create("card");
  cardElement.mount("#card-element");

  const form = document.getElementById("payment-form");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const response = await fetch("/api/payments/create-payment-intent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ amount: 8997 })
    });

    const { clientSecret } = await response.json();

    const result = await stripe.confirmCardPayment(clientSecret, {
      payment_method: {
        card: cardElement,
        billing_details: { name: "Customer Name" }
      }
    });

    if (result.error) {
      document.getElementById("card-errors").textContent = result.error.message;
    } else if (result.paymentIntent.status === "succeeded") {
      await fetch("/orders/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" }
      });
      window.location.href = "/order-confirmation";
    }
  });
</script>

</body>
</html>
